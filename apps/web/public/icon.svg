<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fitness">
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  <!-- progress ring: track + ~75% arc, starting at 12 o'clock -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="40"/>
